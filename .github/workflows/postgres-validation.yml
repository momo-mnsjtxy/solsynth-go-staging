name: PostgreSQL contract validation

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4 resolved 2026-10-07
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # official v5 resolved 2026-10-07
        with:
          go-version: '1.26.4'
          cache: true
      - name: Download and verify declared modules
        run: |
          go mod download
          go mod verify
      - name: Install pinned PostgreSQL 16 syntax parser
        run: |
          python3 -m pip install --isolated --disable-pip-version-check --no-input --index-url https://pypi.org/simple --only-binary=:all: --no-deps --target "$RUNNER_TEMP/sql-parser" -r scripts/sql-parser-requirements.txt
      - name: Ordinary build, vet and race checks
        env:
          PYTHONPATH: ${{ runner.temp }}/sql-parser
          GO_BIN: go
        run: bash scripts/verify.sh

  postgres:
    name: PostgreSQL ${{ matrix.group }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        group: [group-a, group-b]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.4'
          cache: true
      - name: Download and verify declared modules
        run: |
          go mod download
          go mod verify
      - name: Require assigned actual PostgreSQL cases and restart persistence
        env:
          GO_BIN: go
          PG_BIN: /usr/lib/postgresql/16/bin
          PG_TEST_ROOT: ${{ runner.temp }}/solsynth-pg
          PG_TEST_GROUP: ${{ matrix.group }}
          PG_TEST_RESULTS: ${{ runner.temp }}/pg-results
        run: |
          test -x "$PG_BIN/initdb"
          "$PG_BIN/postgres" --version | grep -E '^postgres \(PostgreSQL\) 16\.'
          bash scripts/integration-postgres.sh
      - name: Preserve this group's result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4.6.2
        with:
          name: postgres-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-results/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 7

  contracts:
    if: always()
    needs: [checks, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both groups and ordinary checks to succeed
        env:
          ORDINARY_RESULT: ${{ needs.checks.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          test "$ORDINARY_RESULT" = success
          test "$POSTGRES_RESULT" = success
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download both named result artifacts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # official v4.3.0
        with:
          pattern: postgres-group-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-evidence
          merge-multiple: false
      - name: Recompute the complete fail-closed contract result
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/pg-evidence
        run: |
          set -euo pipefail
          python3 scripts/check-integration-groups.py aggregate --directory "$EVIDENCE_ROOT" | tee "$RUNNER_TEMP/pg-summary.txt"
          cat "$RUNNER_TEMP/pg-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic disposable private-socket databases only. Full build/vet/race and complete named PostgreSQL coverage are required. This does not establish upstream identity-protocol compatibility, production migration readiness, C# differential behavior, upstream watcher/global-filter parity, or whole-platform parity.' >> "$GITHUB_STEP_SUMMARY"
