name: Restore pinned source archive

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/local-catalog-badges-20261008
    paths:
      - .github/workflows/recover-source-5e695228.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out immutable green source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5e695228fab2e3c4eb956851731e09dcad15d04a
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5e695228fab2e3c4eb956851731e09dcad15d04a"
          test "$(git rev-parse HEAD^{tree})" = "981e3aad9aa521b7e37b3acd50cdb6da20424a42"
          mkdir -p "$RUNNER_TEMP/source-recovery"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/source-recovery/solsynth-go-5e695228.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-recovery/git-tree.txt"
          cd "$RUNNER_TEMP/source-recovery"
          sha256sum solsynth-go-5e695228.tar.gz > SHA256SUMS
      - name: Save private recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-source-5e695228
          path: ${{ runner.temp }}/source-recovery/
          if-no-files-found: error
          retention-days: 3
