name: Restore draft archive for integration

on:
  push:
    branches: [integration/all-drafts-20261009]
    paths: [.github/workflows/restore-draft-archive.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ccf5f5dfab3f2f85d5c9d17f25e8185870f99567
          persist-credentials: false
      - name: Verify archive bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c PARTS-SHA256SUMS
          cat archive/drafts-20261009T123136Z.tar.gz.part-* > drafts-20261009T123136Z.tar.gz
          sha256sum -c ARCHIVE-SHA256SUMS
      - name: Preserve verified archive for integration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-draft-archive-ccf5f5df
          path: drafts-20261009T123136Z.tar.gz
          if-no-files-found: error
          retention-days: 7
